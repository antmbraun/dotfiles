id = "antmbraun.space-tasks"
name = "Space tasks"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "List each space's tasks, their state, branch and PR under it in the sidebar"
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "space-tasks.sh"]

[[events]]
on = "tab.created"
command = ["bash", "space-tasks.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "space-tasks.sh"]

[[events]]
on = "tab.renamed"
command = ["bash", "space-tasks.sh"]

[[events]]
on = "tab.moved"
command = ["bash", "space-tasks.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "space-tasks.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "space-tasks.sh"]

[[actions]]
id = "refresh"
title = "Refresh space task lists"
contexts = ["global"]
command = ["bash", "space-tasks.sh"]
