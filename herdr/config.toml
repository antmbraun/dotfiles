onboarding = false

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "$HOME/dotfiles/herdr/toggle-shell.sh"

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "$HOME/dotfiles/herdr/apply-layout.sh"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "$HOME/dotfiles/herdr/plugins/sort-spaces/sort-spaces.sh"

[ui]
status_indicators = "dots"
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = false
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
sidebar_width = 36
sidebar_min_width = 30
sidebar_max_width = 50
# Claude usage: today's and this month's spend plus each account's 5h/7d plan usage.
tab_bar_right = [
  { type = "command", command = "$HOME/dotfiles/herdr/usage.sh", interval_seconds = 60, timeout_seconds = 30 },
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.sidebar.spaces]
# One space per repo (b2b, play, bkr, other), one tab per task: see `task` in ~/dotfiles/zsh/worktrees.zsh.
# The space-tasks plugin reports $summary and, per task N, $tN (state icon and name) and $bN (branch,
# ⎇ for a worktree, PR). Rows with no value disappear.
# Task states: ◐ working, ! needs you, ✓ done, ● idle, ○ no agent.
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "$summary", dim = true, rules = [{ contains = "need", fg = "#f7768e", dim = false }] }],
  [{ token = "$t1", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b1", fg = "#bb9af7", dim = true }],
  [{ token = "$t2", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b2", fg = "#bb9af7", dim = true }],
  [{ token = "$t3", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b3", fg = "#bb9af7", dim = true }],
  [{ token = "$t4", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b4", fg = "#bb9af7", dim = true }],
  [{ token = "$t5", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b5", fg = "#bb9af7", dim = true }],
  [{ token = "$t6", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b6", fg = "#bb9af7", dim = true }],
  [{ token = "$t7", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b7", fg = "#bb9af7", dim = true }],
  [{ token = "$t8", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b8", fg = "#bb9af7", dim = true }],
  [{ token = "$t9", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b9", fg = "#bb9af7", dim = true }],
  [{ token = "$t10", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b10", fg = "#bb9af7", dim = true }],
  [{ token = "$t11", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b11", fg = "#bb9af7", dim = true }],
  [{ token = "$t12", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b12", fg = "#bb9af7", dim = true }],
  [{ token = "$t13", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b13", fg = "#bb9af7", dim = true }],
  [{ token = "$t14", rules = [{ starts_with = "!", fg = "#f7768e", bold = true }, { starts_with = "◐", fg = "#e0af68" }, { starts_with = "✓", fg = "#9ece6a" }, { starts_with = "○", dim = true }] }, { token = "$b14", fg = "#bb9af7", dim = true }],
]

[ui.sidebar.agents]
row_gap = 1
# The Agents panel is the task list: task (tab) and space, then branch, then the last prompt.
# $branch is reported by ~/dotfiles/claude/statusline-command.sh, $last_prompt by
# ~/dotfiles/claude/hooks/herdr-last-prompt.sh.
rows = [
  ["state_icon", { token = "tab", bold = true }, { token = "workspace", dim = true }],
  [{ token = "$branch", fg = "#bb9af7" }],
  [{ token = "$last_prompt", dim = true }],
]

[ui.toast]
delivery = "terminal"
delay_seconds = 3

[experimental]
pane_history = true

[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
text      = "#ffffff"
subtext0  = "#e6eaff"
overlay1  = "#d0d6f5"
overlay0  = "#b8c0e8"
selection_bg  = "#33467c"
active_row_bg = "#292e42"
surface1  = "#7a85b8"
surface0  = "#5a6390"
